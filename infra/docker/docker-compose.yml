services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: donna-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: donna
      POSTGRES_PASSWORD: donna
      POSTGRES_DB: donna
    volumes:
      - donna_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U donna -d donna"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../../services/api
      dockerfile: Dockerfile
    container_name: donna-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - ../../.env
    environment:
      API_ADDR: ":8080"
      DATABASE_URL: postgres://donna:donna@postgres:5432/donna?sslmode=disable
      MIGRATIONS_PATH: /app/migrations
      CONFIG_DIR: /app/configs
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  donna_pg_data:
