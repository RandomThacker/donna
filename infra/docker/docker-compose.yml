services:
  postgres:
    image: postgres:16-alpine
    container_name: donna-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: donna
      POSTGRES_PASSWORD: donna
      POSTGRES_DB: donna
    volumes:
      - donna_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U donna -d donna"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  donna_pg_data:
