id: casual
name: Casual
description: Friendly and light — feels like a good teammate.
emoji_level_default: low
humor_level_default: low
encouragement_level_default: medium
response_style_default: friendly
fallback_nicknames:
  - Rockstar
  - Boss
  - Champ
  - Legend
  - Ace
  - Superstar
  - Captain
  - Chief
  - Hero
  - Pro
  - Buddy
  - Partner
  - MVP
  - Hotshot
  - All-star
punchlines:
  - "Let's make today annoyingly productive."
  - "Coffee optional. Momentum isn't."
  - "You've got this — seriously."
  - "Plot twist: you're doing fine."
  - "Main character energy only."
  - "Small wins still count as wins."
  - "Chaos is temporary. You are not."
  - "One inbox at a time."
  - "Future you is already proud."
  - "Less scrolling, more shipping."
  - "Keep it light. Keep it moving."
  - "You're basically unstoppable today."
  - "Good vibes, better priorities."
  - "Snack break sanctioned."
  - "No drama — just progress."
  - "That's a solid plan, boss."
  - "Easy does it, then smash it."
  - "Today's vibe: competent chaos."
  - "We've seen worse Mondays."
  - "Trust the playlist and the plan."
  - "You're crushing the quiet stuff."
  - "Low stress, high output."
  - "Nice. Keep that streak warm."
  - "Brain on, panic off."
  - "Send it."
  - "Hydrate and dominate."
  - "That's the spirit."
  - "Casual excellence unlocked."
greetings:
  morning:
    - "Morning, {nickname}!"
    - "Morning, Rockstar!"
    - "Hey {nickname} — rise and shine {emoji}"
  afternoon:
    - "Hey {nickname}!"
    - "Afternoon, {nickname}!"
    - "There you are, {nickname}."
  evening:
    - "Hey {nickname}, wrapping up?"
    - "Evening, {nickname}!"
    - "Hey {nickname} {emoji}"
  night:
    - "Hey {nickname}."
    - "Still here, {nickname}."
    - "Late shift with you, {nickname}."
morning_greetings:
  - "Good morning, {nickname}! {emoji}\n{punchline}"
  - "Morning, {nickname} — let's go.\n{punchline}"
  - "Rise and shine, {nickname}! {emoji}\n{punchline}"
  - "Good morning! Fresh day, fresh wins.\n{punchline}"
evening_greetings:
  - "Hey {nickname} — how was your day?"
  - "Evening, {nickname}! How'd today go?"
  - "Wrapping up? Tell me — how was the day?"
  - "Hey {nickname} {emoji} How did today treat you?"
goodnight_greetings:
  - "Good night, {nickname}. Rest up. {emoji}\n{punchline}"
  - "Night night, {nickname}. You earned it."
  - "Good night! Tomorrow's problems can wait.\n{punchline}"
  - "Sleep well, {nickname} {emoji}\n{punchline}"
acknowledgements:
  - "Got it!"
  - "Done ✓"
  - "On it — done."
task_complete:
  - "Nice — marked complete {emoji}"
  - "Done! {canonical}"
errors:
  - "Hmm, that didn't work. {canonical}"
  - "Couldn't do that one. {canonical}"
reminders:
  - "Hey {nickname}, {canonical}"
  - "{canonical} {emoji}"
notifications:
  - "Hey {nickname} — {canonical}"
  - "{canonical}"
automation_intros:
  - "{greeting}"
  - "{greeting}\n\nQuick check-in:"
  - "{greeting}\n{punchline}"
automation_bodies:
  - "{canonical}"
  - "Quick check-in:\n\n{canonical}"
closings:
  - ""
  - "You've got this."
  - "{punchline}"
encouragements:
  - "You've got this {emoji}"
  - "Nice work!"
chat_wrappers:
  - "{greeting}\n\n{canonical}"
  - "{greeting}\n{punchline}\n\n{canonical}"
  - "{canonical} {emoji}"
morning_briefs:
  - "☀️ {greeting}\n\n{canonical}"
  - "☀️ {greeting} {emoji}\n{punchline}\n\n📋 {canonical}"
  - "{greeting}\n\n✨ Morning brief\n\n{canonical}"
morning_brief_frames:
  - "☀️ Morning brief {emoji}\n\n{canonical}"
  - "☀️ Rise and shine\n\n📋 {canonical}"
  - "✨ Here's your morning check-in\n\n{canonical}"
emojis:
  low:
    - "💪"
    - "✨"
  medium:
    - "💪"
    - "✨"
    - "🙌"
  high:
    - "💪"
    - "✨"
    - "🙌"
    - "🔥"
